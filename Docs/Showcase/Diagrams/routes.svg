<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#f5f0e6"/><text x="1750" y="35" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#9e4935">规则示意</text><text x="960" y="150" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="48" fill="#293e38">同样四份材料，两种卷帘结果</text><text x="960" y="280" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="34" fill="#69756a">两滴短雨分开，至少一次在帘起前听见</text><text x="500" y="450" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="36" fill="#293e38">两份羽合成一次长风</text><polyline points="860,450 1080,450" fill="none" stroke="#9e4935" stroke-width="4"/><polygon points="1080,450 1063.7919521576518,457.82937961400216 1063.7919521576518,442.17062038599784" fill="#9e4935"/><text x="1390" y="450" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="36" fill="#293e38">花落 · 露出旧笺</text><text x="500" y="690" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="36" fill="#293e38">两份羽保留两次短风</text><polyline points="860,690 1080,690" fill="none" stroke="#9e4935" stroke-width="4"/><polygon points="1080,690 1063.7919521576518,697.8293796140022 1063.7919521576518,682.1706203859978" fill="#9e4935"/><text x="1390" y="690" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="36" fill="#293e38">花稀 · 留一枝残红</text><text x="960" y="900" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="36" fill="#9e4935">曲尾帘起、风歇、水定 → 观花比照 → 确认入卷</text></svg>