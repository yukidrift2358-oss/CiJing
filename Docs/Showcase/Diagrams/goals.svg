<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#f5f0e6"/><text x="1750" y="35" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="26" fill="#9e4935">规则示意</text><text x="960" y="170" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="48" fill="#293e38">第二章：演奏改变景物状态</text><circle cx="360" cy="430" r="115" fill="#ece9d9" stroke="#293e38" stroke-width="2"/><text x="360" y="430" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="38" fill="#293e38">雨声</text><circle cx="960" cy="430" r="115" fill="#ece9d9" stroke="#293e38" stroke-width="2"/><text x="960" y="430" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="38" fill="#293e38">留白</text><circle cx="1560" cy="430" r="115" fill="#ece9d9" stroke="#293e38" stroke-width="2"/><text x="1560" y="430" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="38" fill="#293e38">曲尾</text><polyline points="500,430 810,430" fill="none" stroke="#9e4935" stroke-width="4"/><polygon points="810,430 793.7919521576518,437.82937961400216 793.7919521576518,422.17062038599784" fill="#9e4935"/><polyline points="1100,430 1410,430" fill="none" stroke="#9e4935" stroke-width="4"/><polygon points="1410,430 1393.7919521576518,437.82937961400216 1393.7919521576518,422.17062038599784" fill="#9e4935"/><text x="360" y="660" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="34" fill="#293e38">每滴雨分别听清</text><text x="960" y="660" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="34" fill="#293e38">风退、水波消散</text><text x="1560" y="660" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="34" fill="#293e38">检查当时景物</text><text x="960" y="850" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="34" fill="#69756a">有效目标不只一种摆法；材料和曲尾状态仍有限制。</text></svg>